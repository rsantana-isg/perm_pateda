[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perm_pateda"
dynamic = ["version"]
description = "Estimation of Distribution Algorithms for permutation-based optimization problems"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Roberto Santana", email = "roberto.santana@ehu.eus" },
]
keywords = [
    "estimation of distribution algorithms", "EDA", "evolutionary computation",
    "permutations", "Mallows model", "generalized Mallows model",
    "combinatorial optimization", "TSP", "QAP", "LOP", "PFSP",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    # perm_pateda reuses the common EDA machinery (core engine, selection,
    # replacement, statistics, visualization) from pateda.  pateda is an
    # in-development package: install it first from the local checkout with
    #   pip install -e packages/pateda
    "pateda>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=3",
    "black>=22",
    "mypy>=0.950",
    "ruff>=0.1",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=1",
    "myst-parser>=2",
]

[project.urls]
Homepage = "https://github.com/rsantana-isg/pateda"
Repository = "https://github.com/rsantana-isg/pateda"
Issues = "https://github.com/rsantana-isg/pateda/issues"

# Single-source the version: read __version__ from src/perm_pateda/__init__.py so
# the only place you bump a release number is that file.
[tool.setuptools.dynamic]
version = { attr = "perm_pateda.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"perm_pateda.functions" = ["**/*.mat", "**/*.dat", "**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
